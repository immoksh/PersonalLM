
services:
  qdrant:
    image: qdrant/qdrant
    container_name: personallm-qdrant
    ports:
      - '6333:6333'
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: personallm-redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    # Persist the queue across restarts so in-flight jobs survive a bounce.
    command: ['redis-server', '--appendonly', 'yes']
    restart: unless-stopped

volumes:
  qdrant_storage:
  redis_data:
